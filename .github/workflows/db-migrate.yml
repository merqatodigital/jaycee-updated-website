name: Database Migrate (Neon)

# Manually run the SQL migrations against a Neon database.
# Requires the DATABASE_URL secret (or DATABASE_URL_STAGING for the staging target).
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which database to migrate'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: npm run migrate
        env:
          DATABASE_URL: ${{ inputs.target == 'staging' && secrets.DATABASE_URL_STAGING || secrets.DATABASE_URL }}
