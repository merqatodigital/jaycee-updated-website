name: Staging Deployment Pipeline

on:
  push:
    branches:
      - develop
      - staging
  pull_request:
    branches:
      - develop
      - staging

jobs:
  validate-and-test:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Type Check & Linting
        run: npm run lint

      - name: Run Core Unit Tests
        run: npm run test

      - name: Build Application for Staging
        run: npm run build
        env:
          NODE_ENV: staging
          VITE_APP_ENV: staging
          VITE_ORDER_URL: https://jaycee.palawancollective.com/

  deploy-staging:
    name: Automated Deploy to Staging
    needs: validate-and-test
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Staging Environment
        run: |
          echo "Deploying to Staging at https://staging.jaycee.palawancollective.com"
          # Automated staging deployment target step
